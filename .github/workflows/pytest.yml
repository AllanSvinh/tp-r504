name: tests unitaires
on: [push]
jobs:
  test1:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.10']
    steps:
      - name: afficher branche et os
        run: |
          echo "Nom de la branche: ${{ github.ref_name }}"
          echo "OS de la VM : ${{ runner.os }}"

      - uses: actions/checkout@v3

      - name: Set up Python for Demo
        uses: actions/setup-python@v4
        with:
          pyhthon-version: ${{ matrix.python-version }}

      - name: Afficher la version de Python
        run: python --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run tests
        run: pytest TP1/test.py
